# Used when building from repo root (e.g. Railway backend service).
# Ensures devDependencies (TypeScript, @types/*) are installed so backend build succeeds.
# ffmpeg needed for audio processing (hum-to-search).
[phases.setup]
aptPkgs = ["ffmpeg"]

[phases.install]
cmds = ["npm ci --include=dev"]

[phases.build]
cmds = ["npm run build --workspace=@parleap/backend"]

[start]
# Model download is idempotent (skips files already on the /data volume) and non-fatal:
# if it fails, the backend still boots — bible wake degrades, song mode is unaffected.
cmd = "cd /app/backend && (bash scripts/download-models.sh || echo '[models] download failed; bible wake degraded') && npm start"
