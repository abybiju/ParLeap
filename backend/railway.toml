[build]
builder = "NIXPACKS"
buildCommand = "cd /app && npm install --workspace=backend && npm run build --workspace=backend"

[deploy]
startCommand = "cd /app/backend && (bash scripts/download-models.sh || echo '[models] download failed; bible wake degraded') && npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

